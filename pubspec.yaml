name: washify
description: "Washify - SaaS multi-tenant car wash station management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.3.5
  firebase_crashlytics: ^4.3.5
  firebase_performance: ^0.10.0+13
  firebase_messaging: ^15.2.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.8.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.70.2
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.1
  crypto: ^3.0.3
  shared_preferences: ^2.5.5
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  freezed: ^2.5.7

flutter:
  uses-material-design: true
